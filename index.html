
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CEBADA COCINA</title>
<style>
body{
    font-family: Arial, sans-serif;
    background:#f8f7f2;
    margin:0;
    padding:20px;
    color:#333;
}
.container{
    max-width:850px;
    margin:auto;
}
h1{
    text-align:center;
    font-size:48px;
    margin-bottom:8px;
    letter-spacing:2px;
}
.subtitle{
    text-align:center;
    color:#6a6a6a;
    margin-bottom:30px;
}
.special-btn{
    width:100%;
    background:#8a735c;
    color:white;
    border:none;
    padding:16px;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
    margin-bottom:20px;
}
.accordion{
    background:#6d7d63;
    color:white;
    cursor:pointer;
    padding:18px;
    width:100%;
    border:none;
    text-align:center;
    font-size:20px;
    border-radius:12px;
    margin-bottom:12px;
}
.panel{
    display:none;
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:15px;
    border:1px solid #d8ded2;
}
.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #eee;
}
.item:last-child{
    border:none;
}
h3{
    margin-top:20px;
    color:#556b55;
}
.total-box{
    background:#eef3ea;
    border:1px solid #c4d0bc;
    padding:20px;
    border-radius:16px;
    margin-top:30px;
    margin-bottom:40px;
}
input,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ccc;
    box-sizing:border-box;
}
#shippingMessage{
    margin-top:12px;
    padding:14px;
    background:#dfe9d8;
    color:#556b55;
    border-radius:10px;
    font-weight:bold;
}
.payment-note{
    margin-top:10px;
    padding:12px;
    background:#f3f6ef;
    border:1px solid #cfd8c7;
    border-radius:10px;
    color:#556b55;
    font-size:14px;
}
.btn{
    background:#556b55;
    color:white;
    border:none;
    width:100%;
    padding:15px;
    border-radius:12px;
    font-size:18px;
    cursor:pointer;
    margin-top:15px;
}
</style>
</head>
<body>
<div class="container">
    <h1>CEBADA COCINA</h1>
    <div class="subtitle">Producción diaria · pedidos programados</div>

    <button class="special-btn" onclick="goToSpecialWhatsApp()">
        TORTAS, EVENTOS Y CATERING 🎂
    </button>

    <div id="products"></div>

    <div class="total-box">
        <h2>Total: $<span id="total">0</span></h2>

        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="text" id="direccion" placeholder="Dirección">
        <input type="text" id="telefono" placeholder="Número de teléfono">

        <select id="zona" onchange="updateShipping()">
            <option value="">Seleccionar zona</option>
            <option value="15000">Luis Guillón / Lavallol / Malvinas / Loma Verde</option>
            <option value="18000">Turdera / Monte Grande / Adrogué</option>
            <option value="24000">El Jagüel / Temperley / Burzaco</option>
            <option value="30000">Lomas / Banfield / Mármol</option>
            <option value="35000">Longchamps / Glew / Escalada</option>
        </select>

        <div id="shippingMessage"></div>

        <select id="pago">
            <option value="">Forma de pago</option>
            <option>Transferencia 100%</option>
            <option>50% transferencia + saldo en efectivo</option>
        </select>

        <div class="payment-note">
            Reserva tu producción con el 50% por transferencia.
        </div>

        <button class="btn" onclick="sendWhatsApp()">Enviar pedido por WhatsApp</button>
    </div>
</div>

<script>
const whatsapp = "5491122897108";
const productsDiv = document.getElementById("products");

const catalog = {
    "GRANOLA": {
        "Opciones": []
    },
    "PANIFICADOS": {
        "Opciones": [
            ["Pan semi integral", 7000],
            ["2 unidades semi integral", 14000],
            ["1 semi integral cortado", 7500],
            ["2 semi integral cortado", 15000],
            ["Centeno", 9000],
            ["2 centeno", 18000],
            ["Centeno cortado", 9500],
            ["2 centeno cortado", 19000]
        ]
    }
};

// GRANOLA con mejor precio en 5
for(let i=1;i<=5;i++){
    let precio = i*9500;
    if(i===5) precio = 45000;

    catalog["GRANOLA"]["Opciones"].push([`${i} bolsa 300gr`, precio]);
}

let selected = {};

function renderProducts(){
    productsDiv.innerHTML = "";

    for(let mainCat in catalog){
        const mainButton = document.createElement("button");
        mainButton.className = "accordion";
        mainButton.innerText = mainCat;

        const mainPanel = document.createElement("div");
        mainPanel.className = "panel";

        mainButton.onclick = ()=>{
            mainPanel.style.display = mainPanel.style.display === "block" ? "none" : "block";
        };

        for(let subCat in catalog[mainCat]){
            const subTitle = document.createElement("h3");
            subTitle.innerText = subCat;
            mainPanel.appendChild(subTitle);

            catalog[mainCat][subCat].forEach(item=>{
                const row = document.createElement("div");
                row.className = "item";

                let extra = "";
                if(item[0].includes("5 bolsa")){
                    extra = " ⭐ Mejor precio";
                }

                const label = document.createElement("label");
                label.textContent = `${item[0]} - $${item[1]}${extra}`;

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.style.width = "auto";
                checkbox.onchange = function(){
                    toggleItem(item[0], item[1], this.checked);
                };

                row.appendChild(label);
                row.appendChild(checkbox);
                mainPanel.appendChild(row);
            });
        }

        productsDiv.appendChild(mainButton);
        productsDiv.appendChild(mainPanel);
    }
}

function toggleItem(name,price,checked){
    if(checked) selected[name]=price;
    else delete selected[name];
    updateTotal();
}

function updateTotal(){
    const total = Object.values(selected).reduce((a,b)=>a+b,0);
    document.getElementById("total").innerText = total;
}

function sendWhatsApp(){
    const pedido = Object.keys(selected).map(x=>"• "+x).join("%0A");
    const total = Object.values(selected).reduce((a,b)=>a+b,0);

    // DETECCIÓN PAN CORTADO
    let panCortado = Object.keys(selected).some(item => item.toLowerCase().includes("cortado"));

    let extraMsg = panCortado ? "%0APAN CORTADO: SI" : "";

    const msg = `Hola! Quiero hacer este pedido:%0A%0A${pedido}%0A%0ATotal: $${total}${extraMsg}`;

    window.open(`https://wa.me/${whatsapp}?text=${msg}`, "_blank");
}

renderProducts();
</script>
</body>
</html>
